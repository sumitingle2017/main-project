{% extends 'shop/base.html' %}
{% block content %}<div class="row"><h2>Menu Manage</h2><a class="btn" href="{% url 'item_add' %}">+ Add Menu</a></div>
<div class="tbl"><table><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr>
{% for i in items %}<tr><td>{{ i.name }}</td><td>{{ i.get_category_display }}</td><td>₹{{ i.price|floatformat:"-2" }}</td><td>{{ i.available|yesno:"Yes,No" }}</td>
<td><a href="{% url 'item_edit' i.id %}">Edit</a> | <a href="{% url 'item_delete' i.id %}">Delete</a></td></tr>{% endfor %}</table></div>{% endblock %}
